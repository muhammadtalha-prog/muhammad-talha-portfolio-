<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="simGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#040817"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#simGrad)" rx="12"/>

  <!-- MATLAB Workstation Header Bar -->
  <rect x="0" y="0" width="800" height="40" fill="#1e293b" rx="12"/>
  <circle cx="25" cy="20" r="6" fill="#ef4444"/>
  <circle cx="45" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="20" r="6" fill="#10b981"/>
  <text x="100" y="24" font-family="monospace" font-size="12" fill="#94a3b8">Simulink Model — IRSTD_FixedPoint_Q8_8.slx [Verilog RTL Validated]</text>

  <!-- Simulink Block Nodes -->
  <!-- Block 1: IR Video Stream -->
  <g transform="translate(60, 160)">
    <rect width="140" height="90" rx="8" fill="#1e293b" stroke="#0070f3" stroke-width="2"/>
    <text x="70" y="45" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">IR Input Stream</text>
    <text x="70" y="65" font-family="monospace" font-size="10" fill="#00e5ff" text-anchor="middle">sfix16_En8</text>
  </g>

  <!-- Connection Line 1 -->
  <path d="M200,205 L270,205" stroke="#00e5ff" stroke-width="3" fill="none"/>
  <polygon points="265,200 275,205 265,210" fill="#00e5ff"/>

  <!-- Block 2: 3x3 Spatial Filter -->
  <g transform="translate(275, 160)">
    <rect width="160" height="90" rx="8" fill="#1e293b" stroke="#00e5ff" stroke-width="2"/>
    <text x="80" y="40" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Spatial Filter</text>
    <text x="80" y="60" font-family="monospace" font-size="10" fill="#f59e0b" text-anchor="middle">(3x3 Kernel Matrix)</text>
  </g>

  <!-- Connection Line 2 -->
  <path d="M435,205 L505,205" stroke="#00e5ff" stroke-width="3" fill="none"/>
  <polygon points="500,200 510,205 500,210" fill="#00e5ff"/>

  <!-- Block 3: 1x3 Bias Correction -->
  <g transform="translate(510, 160)">
    <rect width="160" height="90" rx="8" fill="#1e293b" stroke="#0070f3" stroke-width="2"/>
    <text x="80" y="40" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Bias Correction</text>
    <text x="80" y="60" font-family="monospace" font-size="10" fill="#00e5ff" text-anchor="middle">16-bit Q8.8 FixPt</text>
  </g>

  <!-- Oscilloscope Waveform Box at bottom -->
  <g transform="translate(60, 310)">
    <rect width="610" height="140" rx="8" fill="#030712" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="25" font-family="monospace" font-size="11" fill="#10b981">Simulink Scope — Fixed-Point Simulation Output (Target: 84.4 FPS)</text>
    
    <!-- Waveform Sine Path -->
    <path d="M20,80 Q70,20 120,80 T220,80 T320,80 T420,80 T520,80 T590,80" fill="none" stroke="#00e5ff" stroke-width="2.5"/>
    <path d="M20,85 Q70,40 120,85 T220,85 T320,85 T420,85 T520,85 T590,85" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>
</svg>
