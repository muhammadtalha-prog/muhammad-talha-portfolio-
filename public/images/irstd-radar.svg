<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0070f3" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#00e5ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0070f3" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" rx="12"/>
  
  <!-- Grid Lines -->
  <g stroke="#0070f3" stroke-opacity="0.1" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Concentric Radar Rings -->
  <circle cx="400" cy="250" r="210" fill="none" stroke="#0070f3" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="400" cy="250" r="150" fill="none" stroke="#0070f3" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="400" cy="250" r="90" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6,4"/>
  <circle cx="400" cy="250" r="30" fill="none" stroke="#0070f3" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Radar Crosshairs -->
  <line x1="160" y1="250" x2="640" y2="250" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="400" y1="30" x2="400" y2="470" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Radar Sweep Sector -->
  <path d="M400,250 L580,120 A210,210 0 0,0 400,40 Z" fill="url(#radarSweep)"/>
  <line x1="400" y1="250" x2="580" y2="120" stroke="#00e5ff" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Target Acquisition Reticle -->
  <g transform="translate(510, 150)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#ff2e55" stroke-width="2" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="4" fill="#ff2e55"/>
    <path d="M-25,-10 L-25,-25 L-10,-25" fill="none" stroke="#ff2e55" stroke-width="2.5"/>
    <path d="M25,-10 L25,-25 L10,-25" fill="none" stroke="#ff2e55" stroke-width="2.5"/>
    <path d="M-25,10 L-25,25 L-10,25" fill="none" stroke="#ff2e55" stroke-width="2.5"/>
    <path d="M25,10 L25,25 L10,25" fill="none" stroke="#ff2e55" stroke-width="2.5"/>
    <text x="32" y="5" font-family="'Space Grotesk', monospace" font-size="12" font-weight="bold" fill="#ff2e55">LOCKED // IRSTD</text>
  </g>

  <!-- HUD Telemetry Overlay Card -->
  <rect x="35" y="35" width="220" height="120" rx="8" fill="#0b1329" fill-opacity="0.85" stroke="#0070f3" stroke-width="1.5"/>
  <text x="50" y="60" font-family="monospace" font-size="11" font-weight="bold" fill="#00e5ff">SYSTEM: YOLO11-NANO</text>
  <text x="50" y="80" font-family="monospace" font-size="11" fill="#e2e8f0">ACCURACY: 88.9 mAP</text>
  <text x="50" y="100" font-family="monospace" font-size="11" fill="#e2e8f0">LATENCY: 11.84 ms</text>
  <text x="50" y="120" font-family="monospace" font-size="11" fill="#f59e0b">FPS: 84.4 (2.8x MIL-STD)</text>

  <!-- Outer HUD Frame Corners -->
  <path d="M20,50 L20,20 L50,20" fill="none" stroke="#0070f3" stroke-width="3"/>
  <path d="M780,50 L780,20 L750,20" fill="none" stroke="#0070f3" stroke-width="3"/>
  <path d="M20,450 L20,480 L50,480" fill="none" stroke="#0070f3" stroke-width="3"/>
  <path d="M780,450 L780,480 L750,480" fill="none" stroke="#0070f3" stroke-width="3"/>
</svg>
