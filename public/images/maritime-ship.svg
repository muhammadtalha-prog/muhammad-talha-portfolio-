<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="shipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ocean Background -->
  <rect width="800" height="500" fill="url(#oceanGrad)" rx="12"/>

  <!-- Wave lines -->
  <g stroke="#0070f3" stroke-opacity="0.15" fill="none" stroke-width="1.5">
    <path d="M0,320 Q100,310 200,320 T400,320 T600,320 T800,320"/>
    <path d="M0,360 Q100,350 200,360 T400,360 T600,360 T800,360"/>
    <path d="M0,400 Q100,390 200,400 T400,400 T600,400 T800,400"/>
    <path d="M0,440 Q100,430 200,440 T400,440 T600,440 T800,440"/>
  </g>

  <!-- Cargo Vessel Graphic -->
  <g transform="translate(180, 160)">
    <!-- Hull Base -->
    <path d="M0,140 L60,200 L380,200 L440,140 Z" fill="url(#shipGrad)" stroke="#475569" stroke-width="2"/>
    
    <!-- Containers Stack -->
    <rect x="80" y="80" width="70" height="60" fill="#0070f3" rx="2"/>
    <rect x="160" y="80" width="70" height="60" fill="#f59e0b" rx="2"/>
    <rect x="240" y="80" width="70" height="60" fill="#00e5ff" rx="2"/>

    <rect x="80" y="20" width="70" height="60" fill="#3b82f6" rx="2"/>
    <rect x="160" y="20" width="70" height="60" fill="#ef4444" rx="2"/>
    <rect x="240" y="20" width="70" height="60" fill="#10b981" rx="2"/>

    <!-- Bridge Superstructure -->
    <rect x="330" y="20" width="60" height="120" fill="#64748b" rx="3"/>
    <rect x="340" y="40" width="40" height="15" fill="#00e5ff" fill-opacity="0.8"/>
    <!-- Radar Mast -->
    <line x1="360" y1="20" x2="360" y2="-20" stroke="#00e5ff" stroke-width="3"/>
    <circle cx="360" cy="-20" r="4" fill="#00e5ff" filter="url(#glowCyan)"/>

    <!-- YOLO Detection Bounding Box Overlay -->
    <rect x="-20" y="-40" width="490" height="260" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-dasharray="10,6" filter="url(#glowCyan)"/>
    
    <!-- YOLO Detection Tag Badge -->
    <rect x="-20" y="-70" width="220" height="30" fill="#0070f3" rx="4"/>
    <text x="-10" y="-50" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">YOLO11s-CBAM : 0.902 CONF</text>
  </g>

  <!-- Telemetry Overlay Info -->
  <rect x="540" y="380" width="230" height="90" rx="8" fill="#0b1329" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="555" y="405" font-family="monospace" font-size="11" font-weight="bold" fill="#00e5ff">DATASET: WUTDet Part A</text>
  <text x="555" y="425" font-family="monospace" font-size="11" fill="#e2e8f0">FLAGSHIP mAP@50: 0.868</text>
  <text x="555" y="445" font-family="monospace" font-size="11" fill="#f59e0b">WaveYOLO DWT: 2.9 ms</text>
</svg>
