<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="agentBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#agentBg)" rx="10"/>
  <!-- Interconnected Network Nodes -->
  <line x1="150" y1="120" x2="300" y2="70" stroke="#0070f3" stroke-width="2"/>
  <line x1="300" y1="70" x2="450" y2="120" stroke="#0070f3" stroke-width="2"/>
  <line x1="150" y1="120" x2="220" y2="230" stroke="#00e5ff" stroke-width="2"/>
  <line x1="450" y1="120" x2="380" y2="230" stroke="#00e5ff" stroke-width="2"/>
  <line x1="220" y1="230" x2="380" y2="230" stroke="#f59e0b" stroke-width="2"/>

  <!-- Agent Nodes -->
  <g transform="translate(150, 120)">
    <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#0070f3" stroke-width="3"/>
    <text x="0" y="5" font-family="monospace" font-size="10" font-weight="bold" fill="#00e5ff" text-anchor="middle">PLANNER</text>
  </g>
  <g transform="translate(300, 70)">
    <circle cx="0" cy="0" r="32" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
    <text x="0" y="5" font-family="monospace" font-size="10" font-weight="bold" fill="#f59e0b" text-anchor="middle">CODER</text>
  </g>
  <g transform="translate(450, 120)">
    <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#0070f3" stroke-width="3"/>
    <text x="0" y="5" font-family="monospace" font-size="10" font-weight="bold" fill="#00e5ff" text-anchor="middle">REVIEWER</text>
  </g>
  <g transform="translate(220, 230)">
    <circle cx="0" cy="0" r="25" fill="#1e293b" stroke="#ef4444" stroke-width="3"/>
    <text x="0" y="5" font-family="monospace" font-size="9" font-weight="bold" fill="#ef4444" text-anchor="middle">CONTEXT</text>
  </g>
  <g transform="translate(380, 230)">
    <circle cx="0" cy="0" r="25" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
    <text x="0" y="5" font-family="monospace" font-size="9" font-weight="bold" fill="#10b981" text-anchor="middle">GROK API</text>
  </g>
  <text x="300" y="325" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#00e5ff" text-anchor="middle">AUTONOMOUS MULTI-AGENT ARCHITECTURE</text>
</svg>
